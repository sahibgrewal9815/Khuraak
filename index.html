<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khurak">
<title>Khurak – food tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F5EC;
  --surface: #FFFFFF;
  --ink: #1E2A1A;
  --muted: #66705E;
  --line: #DDE3D3;
  --saag: #2F6B3A;
  --mustard: #E2A812;
  --haldi: #C8642A;
  --phulkari: #B8235A;
  --protein: var(--saag);
  --carbs: var(--mustard);
  --fat: var(--haldi);
  --chip: #E6ECDD;
  --head: "Baloo 2", "Segoe UI", system-ui, sans-serif;
  --body: "Mukta", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141A12; --surface: #1D251A; --ink: #E9EFE2; --muted: #9AA591;
    --line: #2E3A2A; --saag: #6DB27A; --mustard: #F0C040; --haldi: #E58A4E;
    --phulkari: #F0679A; --chip: #273223;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }

header.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 6px;
}
.brand { font-family: var(--head); font-weight: 800; font-size: 28px; color: var(--saag); letter-spacing: -0.5px; }
.brand small { font-weight: 500; font-size: 18px; color: var(--muted); margin-left: 6px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav button { border: 0; background: var(--chip); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
.datenav span { min-width: 92px; text-align: center; font-weight: 700; }

h2 { font-family: var(--head); font-weight: 700; font-size: 22px; margin: 22px 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* ---------- thali ring ---------- */
.thali { display: grid; place-items: center; margin: 8px 0 4px; position: relative; }
.thali svg { width: min(78vw, 300px); height: auto; display: block; }
.thali .center { position: absolute; text-align: center; }
.thali .kcal { font-family: var(--head); font-weight: 800; font-size: 56px; line-height: 1; }
.thali .of { color: var(--muted); font-size: 15px; }
.legend { display: flex; justify-content: center; gap: 18px; font-size: 15px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* ---------- nutrient rows ---------- */
.rows { background: var(--surface); border-radius: 18px; padding: 6px 16px; border: 1px solid var(--line); }
.row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .top { display: flex; justify-content: space-between; gap: 8px; }
.row .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.bar { height: 8px; background: var(--chip); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 4px; background: var(--saag); transition: width .4s ease; }
.bar.over > div { background: var(--phulkari); }
.tag { font-size: 13px; font-weight: 700; padding: 0 8px; border-radius: 10px; margin-left: 6px; }
.tag.low { background: color-mix(in srgb, var(--mustard) 30%, transparent); }
.tag.high { background: color-mix(in srgb, var(--phulkari) 22%, transparent); color: var(--phulkari); }

/* ---------- meal log ---------- */
.meal h3 { font-family: var(--head); font-size: 18px; margin: 16px 0 4px; display: flex; justify-content: space-between; }
.meal h3 span { font-family: var(--body); font-weight: 500; color: var(--muted); font-size: 15px; }
.entry { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; }
.entry .info { flex: 1; min-width: 0; }
.entry .name { font-weight: 700; }
.entry .desc { font-size: 14px; color: var(--muted); }
.entry .kc { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.entry button { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 4px 6px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty button { margin-top: 10px; }

/* ---------- add screen ---------- */
.search { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; margin-top: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid transparent; background: var(--chip); padding: 6px 14px; border-radius: 20px; font-size: 15px; white-space: nowrap; }
.chip.on { background: var(--saag); color: #fff; }
@media (prefers-color-scheme: dark) { .chip.on { color: #10170E; } }
.list { margin-top: 6px; }
.item { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; margin-bottom: 6px; }
.item .sub { font-size: 14px; color: var(--muted); }
.item .plus { font-size: 22px; color: var(--saag); font-weight: 700; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 8, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 560px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
  background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); visibility: hidden;
  transition: transform .25s ease, visibility 0s linear .25s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .25s ease; }
.sheet .grab { width: 44px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 8px; }
.sheet h2 { margin-top: 4px; }
.sheet .label { font-weight: 700; margin-top: 12px; font-size: 15px; color: var(--muted); }
.sheet .chips { flex-wrap: wrap; overflow: visible; padding-top: 6px; }
.stepper { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--chip); font-size: 22px; font-weight: 700; }
.stepper .q { font-family: var(--head); font-size: 26px; font-weight: 700; min-width: 70px; text-align: center; }
.grams { width: 110px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
input[type=range] { width: 100%; accent-color: var(--saag); }
.preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; text-align: center; }
.preview b { display: block; font-family: var(--head); font-size: 22px; line-height: 1.1; }
.preview span { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 14px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; background: var(--saag); color: #fff; }
.btn.ghost { background: var(--chip); color: var(--ink); flex: 0 0 auto; }
@media (prefers-color-scheme: dark) { .btn { color: #10170E; } .btn.ghost { color: var(--ink); } }
.note { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* ---------- history ---------- */
.days { display: flex; align-items: flex-end; gap: 8px; height: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 8px; position: relative; }
.day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 13px; color: var(--muted); }
.day .col { width: 100%; max-width: 34px; background: var(--mustard); border-radius: 8px 8px 3px 3px; min-height: 2px; }
.day .col.over { background: var(--phulkari); }
.goalline { position: absolute; left: 12px; right: 12px; border-top: 2px dashed var(--saag); opacity: .6; }

/* ---------- settings ---------- */
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field input, .field select { width: 120px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: right; }
.stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.stack .btn { flex: none; }

/* ---------- bottom nav ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: none; padding: 10px 0 12px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button .ic { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--saag); font-weight: 700; }
nav.tabs button.addbtn .ic { background: var(--mustard); color: #1E2A1A; width: 44px; height: 32px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; opacity: 0; transition: all .2s; z-index: 30; font-size: 15px; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Khurak<small>ਖੁਰਾਕ</small></div>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <span id="dateLabel">Today</span>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs">
  <div class="in">
    <button data-tab="today" class="on"><span class="ic">◐</span>Today</button>
    <button data-tab="add" class="addbtn"><span class="ic">+</span>Add food</button>
    <button data-tab="history"><span class="ic">▥</span>History</button>
    <button data-tab="settings"><span class="ic">⚙</span>Settings</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="foods.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
